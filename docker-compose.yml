services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ip_manager
      POSTGRES_USER: ipadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_now}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipadmin -d ip_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ipadmin:${POSTGRES_PASSWORD:-change_me_now}@db:5432/ip_manager?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_RECOVERY_CODE: ${ADMIN_RECOVERY_CODE:?ADMIN_RECOVERY_CODE is required}
    command:
      - sh
      - -c
      - pnpm exec prisma migrate deploy && pnpm exec tsx prisma/seed.ts
    networks: [internal]

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://ipadmin:${POSTGRES_PASSWORD:-change_me_now}@db:5432/ip_manager?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      TRUSTED_ORIGIN: ${TRUSTED_ORIGIN:-http://localhost:3000}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      QUERY_RATE_LIMIT: ${QUERY_RATE_LIMIT:-30}
      PAYMENT_RECEIVER: ${PAYMENT_RECEIVER:-0x04bCA584834489C26d6474701400c88D954B7782}
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed.binance.org}
      BSC_CONFIRMATIONS: ${BSC_CONFIRMATIONS:-3}
      BSC_USDT_CONTRACT: ${BSC_USDT_CONTRACT:-0x55d398326f99059ff775485246999027b3197955}
      BSC_USDT_DECIMALS: ${BSC_USDT_DECIMALS:-18}
      BSC_USDC_CONTRACT: ${BSC_USDC_CONTRACT:-0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d}
      BSC_USDC_DECIMALS: ${BSC_USDC_DECIMALS:-18}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
    ports:
      - "3000:3000"
    networks: [internal]

  payment-worker:
    build:
      context: .
      target: builder
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://ipadmin:${POSTGRES_PASSWORD:-change_me_now}@db:5432/ip_manager?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed.binance.org}
      BSC_CONFIRMATIONS: ${BSC_CONFIRMATIONS:-3}
      BSC_USDT_CONTRACT: ${BSC_USDT_CONTRACT:-0x55d398326f99059ff775485246999027b3197955}
      BSC_USDT_DECIMALS: ${BSC_USDT_DECIMALS:-18}
      BSC_USDC_CONTRACT: ${BSC_USDC_CONTRACT:-0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d}
      BSC_USDC_DECIMALS: ${BSC_USDC_DECIMALS:-18}
      PAYMENT_POLL_MS: ${PAYMENT_POLL_MS:-15000}
    command: ["pnpm", "payment:worker"]
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
